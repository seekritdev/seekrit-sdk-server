# CI for this mirror: fmt/clippy/test the sidecar and its vendored core, so
# external PRs get validated. Nothing here publishes — the monorepo's CI builds
# and pushes the seekritdev/sdk-server image, unaffected by where the source is
# mirrored.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            vendor/seekrit-core
      - name: fmt (core)
        run: cargo fmt --check --manifest-path vendor/seekrit-core/Cargo.toml
      - name: fmt (sdk-server)
        run: cargo fmt --check
      - name: clippy (core)
        run: cargo clippy --all-targets --manifest-path vendor/seekrit-core/Cargo.toml -- -D warnings
      - name: clippy (sdk-server)
        run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            vendor/seekrit-core
      - name: test (core)
        run: cargo test --manifest-path vendor/seekrit-core/Cargo.toml
      - name: test (sdk-server)
        run: cargo test
