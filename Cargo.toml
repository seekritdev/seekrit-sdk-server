[package]
name = "seekrit-sdk-server"
version = "0.7.1"
edition = "2021"
rust-version = "1.88"
description = "Cluster-side resolver for seekrit: holds a service token, resolves and decrypts secrets locally (zero-knowledge, via @seekrit/crypto's Rust core), and serves the plaintext over a tiny authed HTTP API. Fronts the External Secrets Operator's webhook provider so Kubernetes can sync seekrit secrets without the API ever seeing plaintext."
license = "MIT"
repository = "https://github.com/seekritdev/seekrit-sdk-server"
publish = false

[[bin]]
name = "seekrit-sdk-server"
path = "src/main.rs"

[lib]
name = "seekrit_sdk_server"
path = "src/lib.rs"

[features]
# Telemetry is on by default: a released binary is observable out of the box and
# still exports nothing until an OTEL_EXPORTER_OTLP_* endpoint is configured.
# Build with `--no-default-features` to compile the OpenTelemetry stack out
# entirely for a smaller binary; instrumentation call sites stay put and become
# no-ops.
default = ["otel"]
otel = ["seekrit-telemetry/otel"]

[dependencies]
# Shared, transport-free zero-knowledge core (token key, DEK unwrap, decrypt).
seekrit-core = { path = "vendor/seekrit-core" }

# Shared OpenTelemetry wiring (OTLP/HTTP traces, metrics, logs). Inert until an
# OTEL_EXPORTER_OTLP_* endpoint is configured; also owns the tracing subscriber
# so all the self-hosted services log identically.
seekrit-telemetry = { path = "../../crates/seekrit-telemetry", default-features = false }

# Opt-in last-known-good cache (--cache-dir): lets a pod that restarts during a
# seekrit outage come back on the last response it saw instead of crash-looping.
seekrit-cache = { path = "../../crates/seekrit-cache" }

# Async HTTP server (the API plane) + client (startup + refresh resolve calls).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
] }

# Lock-free snapshot swap: the refresh task replaces the whole store atomically
# while readers keep serving the previous snapshot without blocking.
arc-swap = "1"

# Response bodies + resolve response deserialization.
serde_json = "1"

# Observability + secret hygiene. The subscriber itself is installed by
# seekrit-telemetry, so only the facade is needed here.
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
# Span-capture harness for the zero-knowledge leak test (tests/telemetry.rs).
seekrit-telemetry = { path = "../../crates/seekrit-telemetry", features = ["testing"] }
# Tests exercise the API over real HTTP; `json` decodes the responses.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
